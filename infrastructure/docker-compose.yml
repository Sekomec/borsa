# ============================================================
# QuantEdge AI — Docker Compose (Development)
# ============================================================
# Servisler:
#   - postgres      : Ana ilişkisel veritabanı (TimescaleDB)
#   - redis         : Cache + Celery broker
#   - chromadb      : Vector veritabanı (RAG / Sentiment)
#   - backend       : FastAPI uygulaması
#   - celery_worker : Arka plan görev işçisi
#   - celery_beat   : Periyodik görev planlayıcı
#   - frontend      : Next.js uygulaması
#   - mlflow        : ML experiment tracking
#   - nginx         : Reverse proxy
# ============================================================

networks:
  quantedge_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  mlflow_data:
  model_artifacts:

services:

  # ----------------------------------------------------------
  # PostgreSQL + TimescaleDB
  # OHLCV zaman serisi, kullanıcı verisi, tahminler
  # ----------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: quantedge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantedge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-quantedge_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init_timescale.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - quantedge_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantedge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis
  # Celery broker + result backend + API cache katmanı
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: quantedge_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - quantedge_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------
  # ChromaDB — Vector Database
  # Haber embedding'leri ve RAG pipeline için
  # ----------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: quantedge_chroma
    restart: unless-stopped
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8001
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8001"
    networks:
      - quantedge_net

  # ----------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: quantedge_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-quantedge}:${POSTGRES_PASSWORD:-quantedge_secret}@postgres:5432/${POSTGRES_DB:-quantedge_db}
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8001
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ENVIRONMENT=development
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
      - model_artifacts:/app/models/artifacts
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quantedge_net
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --log-level info

  # ----------------------------------------------------------
  # Celery Worker — Asenkron görev işçisi
  # Veri çekme, tahmin hesaplama
  # ----------------------------------------------------------
  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: quantedge_celery_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-quantedge}:${POSTGRES_PASSWORD:-quantedge_secret}@postgres:5432/${POSTGRES_DB:-quantedge_db}
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
      - model_artifacts:/app/models/artifacts
    depends_on:
      - redis
      - postgres
    networks:
      - quantedge_net
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=data_fetch,ml_prediction,default
      --hostname=worker@%h

  # ----------------------------------------------------------
  # Celery Beat — Periyodik görev planlayıcı
  # Piyasa saatlerinde otomatik veri güncelleme
  # ----------------------------------------------------------
  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: quantedge_celery_beat
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-quantedge}:${POSTGRES_PASSWORD:-quantedge_secret}@postgres:5432/${POSTGRES_DB:-quantedge_db}
    volumes:
      - ../backend:/app
    depends_on:
      - redis
    networks:
      - quantedge_net
    command: >
      celery -A app.tasks.celery_app beat
      --loglevel=info

  # ----------------------------------------------------------
  # MLflow — ML Experiment Tracking & Model Registry
  # ----------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: quantedge_mlflow
    restart: unless-stopped
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${POSTGRES_USER:-quantedge}:${POSTGRES_PASSWORD:-quantedge_secret}@postgres:5432/${POSTGRES_DB:-quantedge_db}
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quantedge_net
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-quantedge}:${POSTGRES_PASSWORD:-quantedge_secret}@postgres:5432/${POSTGRES_DB:-quantedge_db}
      --default-artifact-root /mlflow/artifacts

  # ----------------------------------------------------------
  # Next.js Frontend
  # ----------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: quantedge_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - quantedge_net
    command: npm run dev

  # ----------------------------------------------------------
  # Nginx — Reverse Proxy
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: quantedge_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - quantedge_net
